<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4fc">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-512.png">
<title>주찬양 플레이어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 고요하고 경건한, 연주회 프로그램처럼 — 밝은 종이 바탕에 앱 아이콘의 보라
   LAYOUT: 위 이름·골라 듣기·설정 / 가운데 목록 / 아래 작은 재생 막대 + 늘 보이는 메뉴(앨범·내 곡·재생 목록·가사)
   (변수 이름 --gold는 '강조색'이라는 뜻으로 그대로 씀 — 지금 강조색은 보라) */
:root{color-scheme:light;--z:1;
 --bg:#f7f4fc;--card:#ffffff;--ink:#231a38;--soft:#6d6585;--line:#e7e0f1;--gold:#6b3fa6;--gold2:#efe7fa;--on:#ffffff;--shadow:0 6px 24px rgba(60,30,110,.10)}
/* 메뉴마다 색: 앨범 보라 · 내 곡 초록 · 재생 목록 파랑 · 라디오 주황빨강 · 성경 갈색 · 가사·악보 청록 */
body[data-tab=mine]{--gold:#2e7d5b;--gold2:#e1f2e8;--bg:#f3f9f5;--line:#d9ebe0}
body[data-tab=lists]{--gold:#2f62b3;--gold2:#e2ebfa;--bg:#f3f6fc;--line:#dbe3f2}
body[data-tab=radio]{--gold:#c2452d;--gold2:#fbe6e0;--bg:#fcf5f3;--line:#f0dcd6}
body[data-tab=bible]{--gold:#8a5a1f;--gold2:#f4eadb;--bg:#faf6ef;--line:#ece1d0}
body[data-tab=lyr]{--gold:#0f7c8a;--gold2:#dcf0f2;--bg:#f2f9fa;--line:#d4e8eb}
:root[data-theme=dark]{color-scheme:dark;
 --bg:#120e22;--card:#1c1632;--ink:#f2edfb;--soft:#a9a0c2;--line:#2f2749;--gold:#b897ee;--gold2:#2c2348;--on:#160f2a;--shadow:0 6px 24px rgba(0,0,0,.35)}
:root[data-theme=dark] body[data-tab=mine]{--gold:#6fd3a2;--gold2:#16332a;--bg:#0f1a16;--line:#22382f}
:root[data-theme=dark] body[data-tab=lists]{--gold:#8db4f5;--gold2:#1a2742;--bg:#0f1420;--line:#25304a}
:root[data-theme=dark] body[data-tab=radio]{--gold:#f29a83;--gold2:#3a1d17;--bg:#1a100e;--line:#3e2621}
:root[data-theme=dark] body[data-tab=bible]{--gold:#e0b57a;--gold2:#33261a;--bg:#18130d;--line:#3a2d1f}
:root[data-theme=dark] body[data-tab=lyr]{--gold:#6fd0dc;--gold2:#163236;--bg:#0d1819;--line:#21393c}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font,"Noto Sans KR"),system-ui,sans-serif;overflow-x:clip;padding-bottom:170px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;min-height:44px;min-width:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.i{width:22px;height:22px;flex:none}
.serif{font-family:"Noto Serif KR",serif}
[hidden]{display:none!important}

/* 위 */
header.top{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);padding:calc(8px + env(safe-area-inset-top)) max(4vw,14px) 8px;border-bottom:3px solid var(--gold);transition:border-color .2s}
#pgTitle{display:flex;align-items:center;gap:6px;color:var(--gold)}#pgTitle .i{width:22px;height:22px}#pgTitle b{font-size:21px;color:var(--ink)}
body{transition:background-color .2s}
.brand{display:flex;align-items:center;gap:10px;max-width:860px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#7b4bbd,#4e2a86);display:grid;place-items:center;color:#f1c96b;flex:none;box-shadow:0 3px 10px rgba(80,40,140,.3)}
.logo .i{width:16px;height:16px}
.brand .name{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname{display:flex;flex-direction:column;line-height:1.2;overflow:hidden}
#bver{color:var(--soft);font-size:11.5px;white-space:nowrap}
#bpick{margin-left:auto;white-space:nowrap;font-size:15px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
#bpick[hidden]{display:none}#bpick[hidden]+#bset{margin-left:auto}
#bpick.on{background:var(--gold);color:var(--on);border-color:var(--gold)}
#bset{color:var(--soft)}

main{max-width:860px;margin:0 auto;padding:0 max(4vw,14px)}
main,.player .pt,.pickbar>.pin,.lyrtop,.lyrin,.sheet>div{zoom:var(--z)}

/* 앨범 */
.albums{display:flex;gap:10px;overflow-x:auto;padding:14px 0 0;scrollbar-width:none}
.albums button{justify-content:flex-start;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:14px;background:var(--card);white-space:nowrap}
.albums img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.albums button[aria-pressed=true]{border-color:var(--gold);background:var(--gold2)}
.hero{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:20px;align-items:center;padding:20px 0 12px}
.hero img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;box-shadow:0 12px 30px rgba(50,20,100,.25)}
.hero h1{word-break:keep-all;font:700 clamp(24px,5vw,38px)/1.2 "Noto Serif KR",serif;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0 0 10px;color:var(--soft);font-size:15px;word-break:keep-all}
/* 표지에 제목이 있으므로 제목 글은 숨김(읽어 주기용으로만 남김), 단추는 한 줄로 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero{padding:12px 0 8px}.hero .bar{flex-wrap:wrap;gap:8px}.hero .bar .pill,.hero .bar .ghost{min-height:42px}
.pill{background:var(--gold);color:var(--on);font-weight:700;padding:0 20px;border-radius:999px;box-shadow:0 4px 14px color-mix(in srgb,var(--gold) 35%,transparent)}
.ghost{border:1px solid var(--line);padding:0 16px;border-radius:999px;background:var(--card)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:max-content;max-width:100%;margin:4px 0 6px;background:var(--card)}
.seg button{padding:0 18px;border-radius:0;white-space:nowrap;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--on);font-weight:700}
.verrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.verrow .lbl{color:var(--soft);font-size:14px}
h2.part{display:flex;align-items:center;justify-content:space-between;gap:8px;font:700 16px/1.3 "Noto Serif KR",serif;color:var(--gold);margin:24px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.partplay{font:500 13px "Noto Sans KR",sans-serif;color:var(--gold);background:var(--gold2);border-radius:999px;padding:0 12px;min-height:34px;white-space:nowrap}
.partplay .i{width:14px;height:14px}

/* 곡 줄 */
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto auto;align-items:center;gap:0;border-bottom:1px solid var(--line);border-radius:12px}
.row .num{color:var(--soft);font-variant-numeric:tabular-nums;text-align:center}
.row .t{padding:7px 0;text-align:left;justify-content:flex-start;display:flex;align-items:baseline;gap:10px;border-radius:0;min-height:44px}
.row .t b{flex:1;min-width:0;font-weight:500;line-height:1.35;word-break:keep-all}
.row .t small{flex:none;color:var(--soft);font-size:13px;font-variant-numeric:tabular-nums}
.row.now{background:var(--gold2);border-bottom-color:transparent}
.row.now .t b{color:var(--gold);font-weight:700}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
.eq i{width:3px;background:var(--gold);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
body.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:4px}50%{height:15px}}
.icon{width:44px;color:var(--soft)}
.row .icon{width:40px;min-width:40px}
a.icon,a.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-decoration:none;color:inherit}
a.icon{color:var(--soft)}
.dlnote{font-size:13px!important;margin:6px 0 0!important}
.icon .i{width:20px;height:20px}
.desc{grid-column:2/-1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 8px 12px 0;font-size:15px}
.desc .meta{color:var(--soft);font-size:13px;margin-bottom:8px}
.desc dt{font-weight:700;margin-top:6px}.desc dd{margin:0 0 4px}
.empty{color:var(--soft);padding:30px 0;text-align:center}
input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);flex:1}
.chk{color:var(--soft)}.chk.on{color:var(--gold)}

/* 아래: 재생 막대 + 메뉴 */
body.noplayer .dock .player{display:none}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;padding-top:10px;background:linear-gradient(to bottom,transparent,var(--bg) 14px)}
.player{position:relative;margin:0 8px 6px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;max-width:860px}
@media (min-width:880px){.player{margin:0 auto 6px}}
.prog{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--gold)}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:2px;padding:9px 8px 8px 9px}
.pt{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center;cursor:pointer;border-radius:10px}
.pt img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--gold2)}
.pt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.pt small{color:var(--soft);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini>button{color:var(--ink)}
.mini .big{width:50px;height:50px;border-radius:50%;background:var(--gold);color:var(--on)}
.bnav{display:flex;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:2px 4px env(safe-area-inset-bottom)}
.bnav button{flex:1;flex-direction:column;gap:1px;font-size:12px;color:var(--soft);padding:6px 0 4px;border-radius:10px}
.bnav button .i{width:23px;height:23px}
.bnav button[aria-selected=true]{color:var(--gold);font-weight:700;background:var(--gold2);box-shadow:inset 0 3px 0 var(--gold)}
.ecard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px;margin:18px 0;text-align:center;box-shadow:var(--shadow)}
.ecard .eic{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--gold2);color:var(--gold)}.ecard .eic .i{width:30px;height:30px}
.ecard h3{margin:12px 0 6px;font-size:19px}.ecard p{margin:0 0 16px;color:var(--soft);line-height:1.65;word-break:keep-all}
.ecard .bar,.ecard form{justify-content:center;margin:0}
.sheet .hint{background:var(--gold2);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.6;word-break:keep-all}
.lyrin .ecard{font-family:var(--font,"Noto Sans KR"),sans-serif}.lyrin .ecard h3{font:700 19px var(--font,"Noto Sans KR"),sans-serif;color:var(--ink);letter-spacing:0;margin:12px 0 6px}.lyrin .ecard p{font-size:16px;line-height:1.65;color:var(--soft);opacity:1;transform:none;margin:0 0 16px}
.pickbar{position:fixed;left:0;right:0;z-index:8;background:var(--gold2);border-top:1px solid var(--line);padding:8px max(4vw,14px)}

/* 큰 재생 화면 */
.np{position:fixed;inset:0;z-index:15;background:linear-gradient(180deg,var(--gold2) 0%,var(--bg) 60%);display:none;flex-direction:column;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 6vw calc(18px + env(safe-area-inset-bottom));overflow:auto}
.np.open{display:flex}
.nptop{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;color:var(--soft);font-size:14px}
.nptop .i{width:28px;height:28px}
.np>img{width:min(80vw,38vh,420px);aspect-ratio:1;object-fit:cover;border-radius:20px;box-shadow:0 18px 40px rgba(50,20,100,.3);margin:8px 0 18px}
.npt{width:100%;max-width:560px;text-align:center}
.npt h2{font:700 clamp(21px,5.5vw,30px)/1.3 "Noto Serif KR",serif;margin:0 0 6px;word-break:keep-all;text-wrap:balance}
.npt p{margin:0;color:var(--soft);font-size:15px;word-break:keep-all}
.npseek{width:100%;max-width:560px;margin:16px 0 0}
input[type=range]{width:100%;accent-color:var(--gold);height:32px;margin:0}
.nptime{display:flex;justify-content:space-between;color:var(--soft);font-size:14px;font-variant-numeric:tabular-nums}
.npctl{display:flex;align-items:center;justify-content:center;gap:clamp(4px,3vw,18px);margin:6px 0 8px}
.npctl button{width:60px;height:60px;border-radius:50%}
.npctl .i{width:30px;height:30px}
.npctl .skip{position:relative;color:var(--soft)}
.npctl .skip small{position:absolute;font-size:10px;font-weight:700;top:50%;left:50%;transform:translate(-50%,-38%)}
.npctl .big{width:84px;height:84px;background:var(--gold);color:var(--on);box-shadow:0 10px 26px color-mix(in srgb,var(--gold) 40%,transparent)}
.npctl .big .i{width:36px;height:36px}
.npmore{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;width:100%;max-width:560px;margin-top:6px}
.npmore button{flex-direction:column;gap:3px;font-size:12.5px;color:var(--soft);padding:8px 0;border-radius:14px;min-height:62px}
.npmore button.on{color:var(--gold);background:var(--card);font-weight:700}
.npmore button[hidden]{display:none}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.prow .pname{font-weight:700;font-size:16px;padding:0 6px;min-width:84px;justify-content:flex-start}
.prow .seg{margin:0}.prow .seg button{padding:0 14px}
.seg.wide{width:100%}.seg.wide button{flex:1}
.phelp{color:var(--soft);font-size:14px;margin:6px 0}
#partsBox button:disabled{opacity:.45}

/* 가사·악보 */
.lyr{position:fixed;inset:0;top:var(--hh,60px);z-index:7;background:var(--bg);overflow:auto;display:none;padding:4px max(3vw,10px) 24px}
.lyr.open{display:block}
.lyrtop{position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0;display:flex;gap:8px;align-items:center;max-width:1100px;margin:0 auto}
.lyrtop .seg{margin:0 0 0 auto}
.lyrtop #lyrClose{display:none}
.lyrin{max-width:640px;margin:0 auto;text-align:center}
.lyrin.wide{max-width:1100px}
.lyrin h2{font-size:24px;margin:4px 0 14px;word-break:keep-all}.lyrin .lnum{color:var(--gold);margin:8px 0 0;font-family:"Noto Sans KR",sans-serif;font-size:14px}
.lyrin h3{font:700 14px "Noto Sans KR",sans-serif;color:var(--gold);margin:22px 0 6px;letter-spacing:.05em}
.lyrin p{font-size:21px;line-height:1.6;margin:2px 0;word-break:keep-all;border-radius:10px;padding:2px 8px;transition:background .3s,color .3s}
.lyrin.timed p{color:var(--soft)}
.lyrin p.cur{color:var(--ink);background:var(--gold2);font-weight:700}
.lyrin blockquote{margin:0 0 10px;color:var(--soft);font-size:15px;line-height:1.6;word-break:keep-all}
.sctitle{font:500 14px "Noto Sans KR",sans-serif;color:var(--soft);margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scoreBox{margin:0 auto}
.sys{position:relative;width:100%;overflow:hidden;background:#fff;border-radius:8px;margin:0 0 8px;box-shadow:0 2px 10px rgba(40,20,80,.12)}
.sys.cur{outline:3px solid color-mix(in srgb,var(--gold) 55%,transparent)}
.sys img{position:absolute;max-width:none;height:auto;display:block}
#scHi{position:absolute;border:2px solid rgba(212,138,30,.75);background:rgba(240,180,60,.14);border-radius:4px}
#scBar{position:absolute;width:3px;margin-left:-1px;background:#d0021b;border-radius:2px;box-shadow:0 0 6px rgba(208,2,27,.5)}
.scpg{font:13px "Noto Sans KR",sans-serif;color:var(--soft);margin:0}

/* 시트·알림 */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,10,40,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet>div{background:var(--card);width:min(560px,100%);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-family:"Noto Serif KR",serif}
.sheet .opt{width:100%;justify-content:flex-start;padding:0 12px;border-bottom:1px solid var(--line);border-radius:0}
.setrow{margin:14px 0 4px;font-weight:700}
.setrow+.seg{width:100%}.setrow+.seg button{flex:1;padding:0 8px}
.toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1}
/* 인터넷 없이 듣기 · 처음 안내 · 도움말 */
.offrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0 4px}
.offrow>.i{color:var(--gold);flex:none}
.offrow>span{flex:1;font-size:15px;line-height:1.35}
.offrow small{display:block;color:var(--soft);font-size:12.5px}
.offrow.on{background:var(--gold2);border-color:transparent}
.offrow .pill,.offrow .ghost{flex:none;padding:0 14px}
.intro .step{color:var(--gold);font-weight:700;margin:0 0 4px}
.intro h3{font-size:22px}
.intro p{font-size:17px;line-height:1.6}
.faq{border-bottom:1px solid var(--line);padding:4px 0}
.faq summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.faq p{margin:0 0 10px;color:var(--soft)}
a.opt{display:flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;color:inherit;padding:0 12px;border-bottom:1px solid var(--line)}
.sheet .opt{gap:8px}
.setver{color:var(--soft);font-size:13px;margin:14px 0 0}
a.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none}
/* 주찬양 라디오 */
.radio{padding:16px 0 10px}
.onair{display:inline-flex;align-items:center;gap:8px;color:#c0262d;font-weight:700;font-size:14px;letter-spacing:.04em}
.onair i{width:10px;height:10px;border-radius:50%;background:#e0313a;box-shadow:0 0 0 0 rgba(224,49,58,.6);animation:air 1.6s infinite}
@keyframes air{0%{box-shadow:0 0 0 0 rgba(224,49,58,.55)}70%{box-shadow:0 0 0 10px rgba(224,49,58,0)}100%{box-shadow:0 0 0 0 rgba(224,49,58,0)}}
.radio h1{font:700 clamp(26px,6vw,38px)/1.2 "Noto Serif KR",serif;margin:6px 0 12px}
.radio .rprog{background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--gold) 65%,#000));color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.radio .rprog b{display:block;font-size:21px}.radio .rprog small{opacity:.9;font-size:14px}
.nowcard{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.nowcard img{width:72px;height:72px;border-radius:12px;object-fit:cover}
.nowcard b{display:block;font-size:17px;word-break:keep-all}.nowcard small{color:var(--soft);font-size:13px;display:block}
.rverse,.rnote{margin:12px 0 0;background:var(--gold2);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.6;word-break:keep-all}

.nextup{color:var(--soft);font-size:14px;margin:10px 2px 0}
.pill.big{min-height:52px;font-size:17px;padding:0 24px}
.rhelp{color:var(--soft);font-size:13px;margin:4px 2px 0}

.sched li b{font-variant-numeric:tabular-nums;color:var(--soft);font-weight:500}
.sched li small{display:block;color:var(--soft);font-size:13px}
.sched li.cur{background:var(--gold2)}.sched li.cur b,.sched li.cur span{color:var(--gold);font-weight:700}
.today{margin:0 0 12px}
.chip{display:inline-block;background:var(--gold);color:var(--on);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;margin:0 6px 6px 0}
.chip.soft{background:var(--gold2);color:var(--gold)}
.today p{font-size:16px;line-height:1.6;margin:4px 0 8px;word-break:keep-all}
.today blockquote{margin:0;border-left:4px solid var(--gold);padding:6px 12px;font-size:15.5px;line-height:1.6;color:var(--ink);word-break:keep-all;background:var(--card);border-radius:0 12px 12px 0}
.today blockquote small{display:block;color:var(--gold);font-weight:700;font-size:13px}
.rcl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 12px}
.rclh{display:flex;gap:6px;flex-wrap:wrap}
.rcl h3{margin:6px 0 4px;font-size:19px;color:var(--ink)}
.rcl ul{list-style:none;margin:0;padding:0}
.rcl li{display:flex;gap:10px;padding:5px 0;border-top:1px dashed var(--line);font-size:16px;line-height:1.5;word-break:keep-all}
.rcl li:first-child{border-top:0}
.rcl li small{flex:none;width:58px;color:var(--gold);font-weight:700;font-size:13.5px;padding-top:2px}
.rcl li.rtrack span{font-size:14px;color:var(--soft)}
.rclsongs{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.rclsongs>small{color:var(--gold);font-weight:700;font-size:13px}
.rsong{justify-content:flex-start;background:color-mix(in srgb,var(--gold) 9%,transparent);padding:6px 10px;font-size:15.5px;text-align:left}
.rsong svg{width:18px;height:18px;flex:none;color:var(--gold)}
.rclsrc{margin:8px 0 0;font-size:12px;color:var(--soft)}
.rcl li .bref{flex:1;justify-content:flex-start;text-align:left;min-height:0;padding:0;font-size:16px;line-height:1.5;color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--gold) 45%,transparent);text-underline-offset:4px;border-radius:4px}
.bsheet h3{margin-bottom:4px}
.bpass h4{margin:14px 0 6px;color:var(--gold);font-size:15px}
.bv{margin:0 0 3px;font-size:17.5px;line-height:1.55;word-break:keep-all}
.bv sup{color:var(--gold);font-weight:700;font-size:12px;margin-right:4px;vertical-align:top;position:relative;top:4px}
.bmiss{color:var(--soft);font-size:15px}
.bsrc{font-size:12px;color:var(--soft);margin:12px 0}
.bmore{margin-top:4px}
.bible .btop{display:flex;gap:6px;align-items:center;position:sticky;top:var(--hh,60px);z-index:2;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line)}
.bible .btop b{font-size:17px}
.bver{margin-left:auto;font-size:13px;color:var(--soft)}
.bch{font-family:"Noto Serif KR",serif;font-size:22px;margin:14px 0 10px}
.btext .bv{font-size:18.5px;line-height:1.6}
.bfont{margin-left:4px;font-weight:700;font-size:17px;min-width:44px}
.bver{margin-left:auto}
.bnavbar{justify-content:space-between;margin:14px 0 24px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-bottom:10px}
.bpk{background:var(--card);border:1px solid var(--line);font-size:15px;min-height:44px;padding:0 4px}
.bpk.on{background:var(--gold);color:var(--on);border-color:var(--gold)}
.bgh{margin:10px 0 6px;color:var(--gold);font-size:14px}
.seg.wrap{flex-wrap:wrap;width:100%;border-radius:14px}.seg.wrap button{flex:1 0 30%}
@media (max-width:520px){.hero{grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:14px}}
@media (prefers-reduced-motion:reduce){.toast,.lyrin p{transition:none}.eq i{animation:none;height:10px}}
</style>
